<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classified Studios — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:#fff;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* LOGIN */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#101010;
    border:1px solid #292929;
    border-radius:16px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    width:60px;
    height:60px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:900;
    font-style:italic;
    background:linear-gradient(145deg,#ddd,#555,#aaa);
    color:#111;
    margin-bottom:20px;
}

.login-box h1{
    font-size:28px;
    margin-bottom:8px;
}

.login-box p{
    color:#888;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:13px 14px;
    background:#080808;
    border:1px solid #303030;
    border-radius:9px;
    color:#fff;
    outline:none;
    margin-bottom:12px;
}

.input:focus{
    border-color:#777;
}

.primary-btn{
    width:100%;
    border:0;
    padding:13px;
    border-radius:9px;
    background:#fff;
    color:#000;
    font-weight:700;
}

.primary-btn:hover{
    opacity:.85;
}

.error{
    background:#301414;
    border:1px solid #713333;
    color:#ffb3b3;
    padding:12px;
    border-radius:9px;
    margin-top:12px;
    white-space:pre-wrap;
}


/* APP */

#app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:230px;
    background:#0b0b0b;
    border-right:1px solid #222;
    padding:22px 15px;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 10px 25px;
    border-bottom:1px solid #222;
    margin-bottom:20px;
}

.brand-logo{
    width:42px;
    height:42px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    font-weight:900;
    font-style:italic;
    background:linear-gradient(145deg,#ddd,#555,#aaa);
    color:#111;
}

.brand span{
    font-weight:800;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.nav button{
    width:100%;
    border:0;
    background:transparent;
    color:#999;
    text-align:left;
    padding:12px;
    border-radius:8px;
}

.nav button:hover,
.nav button.active{
    background:#191919;
    color:#fff;
}

.logout{
    position:absolute;
    bottom:20px;
    left:15px;
    right:15px;
    border:1px solid #333;
    background:#101010;
    color:#aaa;
    padding:11px;
    border-radius:8px;
}

.logout:hover{
    color:#fff;
    border-color:#555;
}


.main{
    margin-left:230px;
    padding:30px;
    max-width:1500px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:28px;
}

.topbar h1{
    font-size:30px;
}

.admin-email{
    color:#888;
    font-size:14px;
}


/* CARDS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#101010;
    border:1px solid #242424;
    border-radius:12px;
    padding:20px;
}

.stat-label{
    color:#888;
    font-size:13px;
    margin-bottom:8px;
}

.stat-number{
    font-size:30px;
    font-weight:800;
}


/* SECTIONS */

.page{
    display:none;
}

.page.active{
    display:block;
}

.section{
    background:#0d0d0d;
    border:1px solid #242424;
    border-radius:13px;
    padding:20px;
    margin-bottom:20px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.section-header h2{
    font-size:20px;
}

.small-btn{
    border:1px solid #333;
    background:#171717;
    color:#fff;
    padding:9px 13px;
    border-radius:8px;
}

.small-btn:hover{
    background:#222;
}

.danger{
    border-color:#673030;
    color:#ffb1b1;
}

.success{
    border-color:#315e3c;
    color:#aee8bc;
}


/* GAMES */

.game-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:15px;
}

.game-card{
    background:#111;
    border:1px solid #292929;
    border-radius:11px;
    overflow:hidden;
}

.game-image{
    height:150px;
    background:#191919;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    overflow:hidden;
}

.game-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.game-body{
    padding:15px;
}

.game-body h3{
    margin-bottom:7px;
}

.game-description{
    color:#888;
    font-size:14px;
    line-height:1.4;
    min-height:40px;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:12px 0;
}

.badge{
    font-size:11px;
    padding:5px 8px;
    border-radius:999px;
    background:#1d1d1d;
    color:#aaa;
}

.badge.published{
    color:#b7efc3;
    border:1px solid #315e3c;
}

.badge.hidden-badge{
    color:#ffbaba;
    border:1px solid #633131;
}

.badge.featured{
    color:#fff;
    border:1px solid #777;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.actions button{
    flex:1;
    min-width:70px;
}


/* APPLICATIONS */

.application{
    background:#111;
    border:1px solid #292929;
    border-radius:10px;
    padding:17px;
    margin-bottom:12px;
}

.application-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:10px;
}

.application h3{
    margin-bottom:5px;
}

.application-meta{
    color:#888;
    font-size:13px;
    line-height:1.6;
}

.application-content{
    margin-top:12px;
    color:#bbb;
    line-height:1.5;
}

.application-content strong{
    color:#fff;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:999px;
    font-size:11px;
    background:#202020;
    color:#aaa;
    height:max-content;
}

.status.accepted{
    color:#b8efc3;
    border:1px solid #315e3c;
}

.status.rejected{
    color:#ffbaba;
    border:1px solid #633131;
}

.status.pending{
    color:#ddd;
    border:1px solid #555;
}


/* FORMS */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:7px;
}

textarea.input{
    min-height:120px;
    resize:vertical;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:9px;
    margin:10px 0;
    color:#aaa;
}

.checkbox-row input{
    width:17px;
    height:17px;
}

.form-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.form-actions button{
    flex:1;
}

.message{
    padding:11px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

.message.show{
    display:block;
}

.message.success-message{
    background:#102217;
    border:1px solid #315e3c;
    color:#b8efc3;
}

.message.error-message{
    background:#301414;
    border:1px solid #713333;
    color:#ffb3b3;
    white-space:pre-wrap;
}


/* ANNOUNCEMENT PREVIEW */

.announcement-preview{
    border:1px solid #333;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
}

.preview-label{
    padding:8px 12px;
    background:#181818;
    color:#777;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.preview-banner{
    padding:13px 45px 13px 15px;
    background:#111;
    position:relative;
    color:#fff;
    font-size:14px;
}

.preview-close{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#888;
}


/* EMPTY */

.empty{
    text-align:center;
    padding:40px 20px;
    color:#666;
}


/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:700px;
    max-height:90vh;
    overflow:auto;
    background:#101010;
    border:1px solid #303030;
    border-radius:14px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:0;
    background:transparent;
    color:#777;
    font-size:25px;
}

.close:hover{
    color:#fff;
}


/* MOBILE */

@media(max-width:850px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
        bottom:auto;
        border-right:0;
        border-bottom:1px solid #222;
    }

    .logout{
        position:static;
        margin-top:15px;
        width:100%;
    }

    .main{
        margin-left:0;
        padding:20px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .game-list{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>


<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-box">

        <div class="logo">C</div>

        <h1>Classified Studios</h1>

        <p>Admin Dashboard</p>

        <form id="loginForm">

            <input
                id="email"
                class="input"
                type="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                id="password"
                class="input"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                class="primary-btn"
                type="submit"
            >
                Login
            </button>

        </form>

        <div
            id="loginError"
            class="error hidden"
        ></div>

    </div>

</div>


<!-- APP -->

<div
    id="app"
    class="hidden"
>

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-logo">
                C
            </div>

            <span>
                Classified Studios
            </span>

        </div>


        <nav class="nav">

            <button
                class="active"
                data-page="dashboard"
                onclick="showPage('dashboard')"
            >
                Dashboard
            </button>

            <button
                data-page="games"
                onclick="showPage('games')"
            >
                Games
            </button>

            <button
                data-page="applications"
                onclick="showPage('applications')"
            >
                Applications
            </button>

            <button
                data-page="announcements"
                onclick="showPage('announcements')"
            >
                Announcements
            </button>

            <button
                data-page="settings"
                onclick="showPage('settings')"
            >
                Website Settings
            </button>

        </nav>


        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </aside>


    <main class="main">

        <div class="topbar">

            <div>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

            </div>

            <div
                id="adminEmail"
                class="admin-email"
            ></div>

        </div>


        <!-- DASHBOARD -->

        <section
            id="page-dashboard"
            class="page active"
        >

            <div class="stats">

                <div class="stat">

                    <div class="stat-label">
                        Total Games
                    </div>

                    <div
                        id="statGames"
                        class="stat-number"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Published Games
                    </div>

                    <div
                        id="statPublished"
                        class="stat-number"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Applications
                    </div>

                    <div
                        id="statApplications"
                        class="stat-number"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Pending Applications
                    </div>

                    <div
                        id="statPending"
                        class="stat-number"
                    >
                        0
                    </div>

                </div>

            </div>


            <div class="section">

                <div class="section-header">

                    <h2>
                        Quick Actions
                    </h2>

                </div>


                <div class="actions">

                    <button
                        class="small-btn success"
                        onclick="openGameModal()"
                    >
                        + Add Game
                    </button>


                    <button
                        class="small-btn"
                        onclick="showPage('games')"
                    >
                        Manage Games
                    </button>


                    <button
                        class="small-btn"
                        onclick="showPage('applications')"
                    >
                        View Applications
                    </button>


                    <button
                        class="small-btn"
                        onclick="showPage('announcements')"
                    >
                        Announcements
                    </button>


                    <button
                        class="small-btn"
                        onclick="showPage('settings')"
                    >
                        Website Settings
                    </button>

                </div>

            </div>

        </section>


        <!-- GAMES -->

        <section
            id="page-games"
            class="page"
        >

            <div class="section">

                <div class="section-header">

                    <h2>
                        Games
                    </h2>

                    <button
                        class="small-btn success"
                        onclick="openGameModal()"
                    >
                        + Add Game
                    </button>

                </div>


                <div
                    id="gamesMessage"
                    class="message"
                ></div>


                <div
                    id="gamesList"
                    class="game-list"
                ></div>

            </div>

        </section>


        <!-- APPLICATIONS -->

        <section
            id="page-applications"
            class="page"
        >

            <div class="section">

                <div class="section-header">

                    <h2>
                        Job Applications
                    </h2>

                    <button
                        class="small-btn"
                        onclick="loadApplications()"
                    >
                        Refresh
                    </button>

                </div>


                <div
                    id="applicationsMessage"
                    class="message"
                ></div>


                <div
                    id="applicationsList"
                ></div>

            </div>

        </section>


        <!-- ANNOUNCEMENTS -->

        <section
            id="page-announcements"
            class="page"
        >

            <div class="section">

                <div class="section-header">

                    <h2>
                        Global Announcement
                    </h2>

                    <button
                        class="small-btn"
                        onclick="loadAnnouncement()"
                    >
                        Refresh
                    </button>

                </div>


                <div
                    id="announcementMessage"
                    class="message"
                ></div>


                <div class="form-group">

                    <label for="announcementText">
                        Announcement Message
                    </label>

                    <textarea
                        id="announcementText"
                        class="input"
                        placeholder="Admin: Hello!"
                        maxlength="500"
                    ></textarea>

                </div>


                <label class="checkbox-row">

                    <input
                        id="announcementActive"
                        type="checkbox"

                    Show announcement on website

                </label>


                <div class="form-actions">

                    <button
                        class="small-btn"
                        type="button"
                        onclick="hideAnnouncement()"
                    >
                        Hide Announcement
                    </button>


                    <button
                        class="primary-btn"
                        type="button"
                        onclick="publishAnnouncement()"
                    >
                        Publish Announcement
                    </button>

                </div>


                <div class="announcement-preview">

                    <div class="preview-label">
                        Website Preview
                    </div>

                    <div class="preview-banner">

                        <span id="announcementPreview">
                            Your announcement will appear here.
                        </span>

                        <span class="preview-close">
                            ×
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- SETTINGS -->

        <section
            id="page-settings"
            class="page"
        >

            <div class="section">

                <div class="section-header">

                    <h2>
                        Website Settings
                    </h2>

                </div>


                <div
                    id="settingsMessage"
                    class="message"
                ></div>


                <form id="settingsForm">

                    <div class="form-group">

                        <label for="heroTitle">
                            Hero Title
                        </label>

                        <input
                            id="heroTitle"
                            class="input"
                            type="text"
                        >

                    </div>


                    <div class="form-group">

                        <label for="heroDescription">
                            Hero Description
                        </label>

                        <textarea
                            id="heroDescription"
                            class="input"
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="aboutText">
                            About Text
                        </label>

                        <textarea
                            id="aboutText"
                            class="input"
                        ></textarea>

                    </div>


                    <button
                        class="primary-btn"
                        type="submit"
                    >
                        Save Website Settings
                    </button>

                </form>

            </div>

        </section>

    </main>

</div>


<!-- GAME MODAL -->

<div
    id="gameModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="gameModalTitle">
                Add Game
            </h2>

            <button
                class="close"
                onclick="closeGameModal()"
            >
                ×
            </button>

        </div>


        <div
            id="gameMessage"
            class="message"
        ></div>


        <form id="gameForm">

            <input
                id="gameId"
                type="hidden"
            >


            <div class="form-group">

                <label for="gameTitle">
                    Game Title
                </label>

                <input
                    id="gameTitle"
                    class="input"
                    type="text"
                    required
                >

            </div>


            <div class="form-group">

                <label for="gameOrder">
                    Sort Order
                </label>

                <input
                    id="gameOrder"
                    class="input"
                    type="number"
                    value="0"
                >

            </div>


            <div class="form-group">

                <label for="gameDescription">
                    Description
                </label>

                <textarea
                    id="gameDescription"
                    class="input"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="gameImage">
                    Image URL / Path
                </label>

                <input
                    id="gameImage"
                    class="input"
                    type="text"
                    placeholder="/images/game.png"
                >

            </div>


            <div class="form-group">

                <label for="gameRoblox">
                    Roblox Game URL
                </label>

                <input
                    id="gameRoblox"
                    class="input"
                    type="text"
                    placeholder="https://www.roblox.com/games/..."
                >

            </div>


            <label class="checkbox-row">

                <input
                    id="gamePublished"
                    type="checkbox"
                >

                Published

            </label>


            <label class="checkbox-row">

                <input
                    id="gameFeatured"
                    type="checkbox"
                >

                Featured Game

            </label>


            <div class="form-actions">

                <button
                    type="button"
                    class="small-btn"
                    onclick="closeGameModal()"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Game
                </button>

            </div>

        </form>

    </div>

</div>


<script>

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* HELPERS */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function safeUrl(value){

    if(!value){
        return "";
    }

    const url =
        String(value).trim();


    if(
        url.startsWith("/") ||
        url.startsWith("./") ||
        url.startsWith("../")
    ){
        return url;
    }


    try{

        const parsed =
            new URL(url);


        if(
            parsed.protocol === "https:" ||
            parsed.protocol === "http:"
        ){
            return parsed.href;
        }

    }catch(error){}


    return "";
}


function showMessage(
    elementId,
    text,
    success = false
){

    const element =
        document.getElementById(
            elementId
        );


    if(!element){
        return;
    }


    element.textContent =
        text;


    element.className =
        "message show " +
        (
            success
                ? "success-message"
                : "error-message"
        );
}


function hideMessage(elementId){

    const element =
        document.getElementById(
            elementId
        );


    if(element){

        element.className =
            "message";

        element.textContent =
            "";

    }
}


/* NAVIGATION */

function showPage(page){

    document
        .querySelectorAll(".page")
        .forEach(section => {

            section.classList.remove(
                "active"
            );

        });


    const target =
        document.getElementById(
            "page-" + page
        );


    if(target){

        target.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(".nav button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.page === page
            );

        });


    const titles = {

        dashboard:"Dashboard",
        games:"Games",
        applications:"Applications",
        announcements:"Announcements",
        settings:"Website Settings"

    };


    document.getElementById(
        "pageTitle"
    ).textContent =
        titles[page] || "Dashboard";


    if(page === "dashboard"){
        loadDashboard();
    }

    if(page === "games"){
        loadGames();
    }

    if(page === "applications"){
        loadApplications();
    }

    if(page === "announcements"){
        loadAnnouncement();
    }

    if(page === "settings"){
        loadSettings();
    }

}


/* AUTH */

async function checkAdmin(){

    const {
        data:{user},
        error
    } =
        await supabaseClient.auth.getUser();


    if(error || !user){

        showLogin();

        return false;

    }


    const {
        data:admin,
        error:adminError
    } =
        await supabaseClient
            .from("admin_users")
            .select("id")
            .eq("id",user.id)
            .maybeSingle();


    if(adminError){

        showLogin();

        const errorBox =
            document.getElementById(
                "loginError"
            );


        errorBox.textContent =
            "Admin verification failed:\n" +
            adminError.message;


        errorBox.classList.remove(
            "hidden"
        );


        return false;

    }


    if(!admin){

        await supabaseClient.auth.signOut();

        showLogin();


        const errorBox =
            document.getElementById(
                "loginError"
            );


        errorBox.textContent =
            "This account is not authorized as an admin.";


        errorBox.classList.remove(
            "hidden"
        );


        return false;

    }


    showApp(user);

    return true;

}


function showLogin(){

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");


    document
        .getElementById("app")
        .classList.add("hidden");

}


function showApp(user){

    document
        .getElementById("loginScreen")
        .classList.add("hidden");


    document
        .getElementById("app")
        .classList.remove("hidden");


    document.getElementById(
        "adminEmail"
    ).textContent =
        user.email || "";


    loadDashboard();

}


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const errorBox =
                document.getElementById(
                    "loginError"
                );


            errorBox.classList.add(
                "hidden"
            );


            const {
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email,
                        password

                    });


            if(error){

                errorBox.textContent =
                    error.message;


                errorBox.classList.remove(
                    "hidden"
                );

            }

    );


async function logout(){

    await supabaseClient.auth.signOut();

    showLogin();

}


/* DASHBOARD */

async function loadDashboard(){

    const [
        gamesResult,
        applicationsResult
    ] =
        await Promise.all([

            supabaseClient
                .from("games")
                .select("*"),

            supabaseClient
                .from("applications")
                .select("*")

        ]);


    const games =
        gamesResult.data || [];


    const applications =
        applicationsResult.data || [];


    document.getElementById(
        "statGames"
    ).textContent =
        games.length;


    document.getElementById(
        "statPublished"
    ).textContent =
        games.filter(
            game => game.published === true
        ).length;


    document.getElementById(
        "statApplications"
    ).textContent =
        applications.length;


    document.getElementById(
        "statPending"
    ).textContent =
        applications.filter(
            app =>
                String(app.status || "")
                    .toLowerCase() === "pending"
        ).length;

}


/* GAMES */

async function loadGames(){

    const container =
        document.getElementById(
            "gamesList"
        );


    container.innerHTML =
        '<div class="empty">Loading games...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("games")
            .select("*")
            .order(
                "sort_order",
                {
                    ascending:true
                }
            );


    if(error){

        container.innerHTML =
            '<div class="empty">' +
            escapeHTML(
                "Could not load games.\n\n" +
                error.message
            ) +
            '</div>';


        return;

    }


    const games =
        data || [];


    if(games.length === 0){

        container.innerHTML =
            '<div class="empty">' +
            'No games yet. Click "+ Add Game" to create one.' +
            '</div>';


        return;

    }


    container.innerHTML =
        games.map(game => {

            const image =
                safeUrl(game.image_url);


            const roblox =
                safeUrl(game.roblox_url);


            return `

                <div class="game-card">

                    <div class="game-image">

                        ${
                            image
                                ? `
                                    <img
                                        src="${escapeHTML(image)}"
                                        alt=""
                                    >
                                `
                                : "No Image"
                        }

                    </div>


                    <div class="game-body">

                        <h3>
                            ${escapeHTML(game.title)}
                        </h3>


                        <div class="game-description">
                            ${escapeHTML(game.description)}
                        </div>


                        <div class="badges">

                            ${
                                game.published
                                    ? `
                                        <span class="badge published">
                                            Published
                                        </span>
                                    `
                                    : `
                                        <span class="badge hidden-badge">
                                            Hidden
                                        </span>
                                    `
                            }


                            ${
                                game.featured
                                    ? `
                                        <span class="badge featured">
                                            Featured
                                        </span>
                                    `
                                    : ""
                            }

                        </div>


                        <div class="actions">

                            <button
                                class="small-btn"
                                onclick="editGame('${game.id}')"
                            >
                                Edit
                            </button>


                            <button
                                class="small-btn"
                                onclick="togglePublished(
                                    '${game.id}',
                                    ${game.published ? "true" : "false"}
                                )"
                            >
                                ${
                                    game.published
                                        ? "Hide"
                                        : "Publish"
                                }
                            </button>


                            <button
                                class="small-btn"
                                onclick="toggleFeatured(
                                    '${game.id}',
                                    ${game.featured ? "true" : "false"}
                                )"
                            >
                                ${
                                    game.featured
                                        ? "Unfeature"
                                        : "Feature"
                                }
                            </button>


                            ${
                                roblox
                                    ? `
                                        <button
                                            class="small-btn"
                                            onclick="window.open(
                                                '${escapeHTML(roblox)}',
                                                '_blank',
                                                'noopener'
                                            )"
                                        >
                                            Roblox
                                        </button>
                                    `
                                    : ""
                            }


                            <button
                                class="small-btn danger"
                                onclick="deleteGame('${game.id}')"
                            >

function openGameModal(game = null){

    hideMessage("gameMessage");


    document
        .getElementById("gameForm")
        .reset();


    document.getElementById(
        "gameId"
    ).value = "";


    document.getElementById(
        "gameOrder"
    ).value = 0;


    if(game){

        document.getElementById(
            "gameModalTitle"
        ).textContent =
            "Edit Game";


        document.getElementById(
            "gameId"
        ).value =
            game.id || "";


        document.getElementById(
            "gameTitle"
        ).value =
            game.title || "";


        document.getElementById(
            "gameDescription"
        ).value =
            game.description || "";


        document.getElementById(
            "gameImage"
        ).value =
            game.image_url || "";


        document.getElementById(
            "gameRoblox"
        ).value =
            game.roblox_url || "";


        document.getElementById(
            "gameOrder"
        ).value =
            game.sort_order ?? 0;


        document.getElementById(
            "gamePublished"
        ).checked =
            game.published === true;


        document.getElementById(

    }else{

        .classList.add("show");

}


function closeGameModal(){

    document
        .getElementById("gameModal")
        .classList.remove("show");

}


async function editGame(id){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("games")
            .select("*")
            .eq("id",id)
            .maybeSingle();


    if(error){

        alert(
            "Could not load game:\n\n" +
            error.message
        );


        return;

    }


    if(!data){

        alert(
            "Game not found."
        );


        return;

    }


    openGameModal(data);

}


/* SAVE GAME */

document
    .getElementById("gameForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            hideMessage(
                "gameMessage"
            );


            const id =
                document
                    .getElementById("gameId")
                    .value
                    .trim();


            const gameData = {

                title:
                    document
                        .getElementById("gameTitle")
                        .value
                        .trim(),

                description:
                    document
                        .getElementById("gameDescription")
                        .value
                        .trim(),

                image_url:
                    document
                        .getElementById("gameImage")
                        .value
                        .trim() || null,

                roblox_url:
                    document
                        .getElementById("gameRoblox")
                        .value
                        .trim() || null,

                published:
                    document
                        .getElementById("gamePublished")
                        .checked,

                featured:
                    document
                        .getElementById("gameFeatured")
                        .checked,

                sort_order:
                    Number(
                        document
                            .getElementById("gameOrder")
                            .value
                    ) || 0

            };


            if(
                !gameData.title
            ){

                showMessage(
                    "gameMessage",
                    "Game title is required."
                );


                return;

            }


            /*
                If this game is becoming featured,
                remove featured from the others first.
            */

            if(gameData.featured){

                const {
                    error:
                        unfeatureError
                } =
                    await supabaseClient
                        .from("games")
                        .update({
                            featured:false
                        })
                        .neq(
                            "id",
                            id ||
                            "00000000-0000-0000-0000-000000000000"
                        );


                if(unfeatureError){

                    showMessage(
                        "gameMessage",
                        "Could not update featured game:\n\n" +
                        unfeatureError.message
                    );


                    return;

                }

            }


            let error = null;


            if(id){

                const result =
                    await supabaseClient
                        .from("games")
                        .update(gameData)
                        .eq("id",id);


                error =
                    result.error;

            }else{

                const result =
                    await supabaseClient
                        .from("games")
                        .insert(gameData);


                error =
                    result.error;

            }


            if(error){

                showMessage(
                    "gameMessage",
                    "Could not save game:\n\n" +
                    error.message
                );


                return;

            }


            showMessage(
                "gameMessage",
                "Game saved successfully.",
                true
            );


            setTimeout(
                async () => {

                    closeGameModal();

                    await loadGames();

                    await loadDashboard();

                },
                500
            );

        }
    );


async function togglePublished(
    id,
    current
){

    const newValue =
        current !== true;


    const {
        error
    } =
        await supabaseClient
            .from("games")
            .update({
                published:newValue
            })
            .eq("id",id);


    if(error){

        alert(
            "Could not change publish status:\n\n" +
            error.message
        );


        return;

    }


    await loadGames();

    await loadDashboard();

}


async function toggleFeatured(
    id,
    current
){

    const newValue =
        current !== true;


    if(newValue){

        const {
            error:
                unfeatureError
        } =
            await supabaseClient
                .from("games")
                .update({
                    featured:false
                })
                .neq("id",id);


        if(unfeatureError){

            alert(
                "Could not update featured games:\n\n" +
                unfeatureError.message
            );


            return;

        }

    }


    const {
        error
    } =
        await supabaseClient
            .from("games")
            .update({
                featured:newValue
            })
            .eq("id",id);


    if(error){

        alert(
            "Could not change featured status:\n\n" +
            error.message
        );


        return;

    }


    await loadGames();

}


async function deleteGame(id){

    if(
        !confirm(
            "Are you sure you want to delete this game?"
        )
    ){
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("games")
            .delete()
            .eq("id",id);


    if(error){

        alert(
            "Could not delete game:\n\n" +
            error.message
        );


        return;

    }


    await loadGames();

    await loadDashboard();

}

async function loadAnnouncement(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("announcements")
            .select("*")

async function publishAnnouncement(){

    const text =
        document.getElementById(
            "announcementText"
        ).value.trim();


    if(!text){

        showMessage(
            "announcementMessage",
            "Please enter an announcement."
        );


        return;

    }


    const {
        data:existing,
        error:findError
    } =
        await supabaseClient
            .from("announcements")
            .select("id")
            .limit(1)
            .maybeSingle();


    if(findError){

        showMessage(
            "announcementMessage",
            "Could not find announcement:\n\n" +
            findError.message
        );


        return;

    }


    let result;


    if(existing){

        result =
            await supabaseClient
                .from("announcements")
                .update({

                    message:text,
                    active:true,
                    updated_at:
                        new Date().toISOString()

                })
                .eq("id",existing.id);

    }else{

        result =
            await supabaseClient
                .from("announcements")
                .insert({

                    message:text,
                    active:true

                });

    }


    if(result.error){

        showMessage(
            "announcementMessage",
            "Could not publish announcement:\n\n" +
            result.error.message
        );


        return;

    }


    document.getElementById(
        "announcementActive"
    ).checked = true;


    showMessage(
        "announcementMessage",
        "Announcement published successfully.",
        true
    );

}


async function hideAnnouncement(){

    const {
        data:existing,
        error:findError
    } =
        await supabaseClient
            .from("announcements")
            .select("id")
            .limit(1)
            .maybeSingle();


    if(findError){

        showMessage(
            "announcementMessage",
            "Could not find announcement:\n\n" +
            findError.message
        );


        return;

    }


    if(!existing){

        showMessage(
            "announcementMessage",
            "There is no announcement to hide."
        );


        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("announcements")
            .update({
                active:false,
                updated_at:
                    new Date().toISOString()
            })
            .eq("id",existing.id);


    if(error){

        showMessage(
            "announcementMessage",
            "Could not hide announcement:\n\n" +
            error.message
        );


        return;

    }


    document.getElementById(
        "announcementActive"
    ).checked = false;


    showMessage(
        "announcementMessage",
        "Announcement hidden.",
        true
    );

}

/* STARTUP */

(async function(){

    const {
        data:{session}
    } =
        await supabaseClient.auth
            .getSession();


    if(session){

        await checkAdmin();

    }else{

        showLogin();

    }


    supabaseClient.auth.onAuthStateChange(
        async function(event,session){

                event === "SIGNED_IN" &&

            if(
                event === "SIGNED_OUT"
            ){

                showLogin();

            }

        }
    );
